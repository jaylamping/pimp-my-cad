name: Windows installer

# Run by hand (Actions tab > Windows installer > Run workflow) to get the installer
# as a build artifact, or push a tag like v0.1.0 to also attach it to a draft release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/step2glb/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Freeze the STEP converter (PyInstaller)
        run: |
          pip install -r tools/step2glb/requirements.txt pyinstaller
          python tools/step2glb/test_step2glb.py
          python tools/step2glb/build_sidecar.py

      - run: npm ci
      - name: Build installer
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: TandemCAD-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "TandemCAD $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe --clobber
