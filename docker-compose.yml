# docker compose up --build   ->   http://localhost:8080
# Copy .env.example to .env first and fill in the three secrets.
services:
  app:
    build: .
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      blobs: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://pimp:${POSTGRES_PASSWORD}@db:5432/pimp
      S3_ENDPOINT: http://blobs:9000
      S3_BUCKET: pimp-my-cad
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-pimp}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PIMP_MASTER_KEY: ${PIMP_MASTER_KEY}
      PIMP_ADMIN_TOKEN: ${PIMP_ADMIN_TOKEN}
      IMPORT_DIR: /import
    volumes:
      # Your CAD export folder, read-only. Originals are never modified.
      - ${CAD_DIR:-./cad-import}:/import:ro

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pimp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pimp
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pimp -d pimp"]
      interval: 3s
      retries: 20

  # Local S3-compatible store. The app only speaks the S3 API, so R2/S3/B2 later
  # is an endpoint + keys change. Override BLOBS_IMAGE if this tag is unavailable.
  blobs:
    image: ${BLOBS_IMAGE:-quay.io/minio/minio:latest}
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pimp}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [blobdata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

volumes:
  pgdata:
  blobdata:
